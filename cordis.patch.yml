# ============================================================================
# dsh-friends —— DSH 鲸友好友系统 bundle patch
# ============================================================================
# 把 host 侧的「鲸友」插件行插入 DSH 配置树。host 侧负责：
#   - 本地资料（昵称/签名/好友码/好友列表）持久化
#   - 任务运行状态采集（通过模型工具上报）
#   - 给模型注册 friend_* 工具
# 实时在线通信全部在浏览器 client 侧经加密 WSS 完成，host 不发起外联。
#
# 安装：
#   dsh plugin --profile web add dsh-friends
# 本地开发：
#   dsh plugin --profile web add link:<本目录绝对路径>
# ============================================================================

- insert:
    - id: dsh-friends
      name: dsh-friends
