<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-friends render harness</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #11151c; color: #e8eaed;
    font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  /* 测试运行时（ego-linux）不带 emoji 字体；显式挂上 Windows 的 Segoe UI Emoji，
     让渲染截图里的 emoji 与真实 DSH（Windows Chrome/Electron）一致。 */
  @font-face {
    font-family: 'TestEmoji';
    src: url('file:///C:/Windows/Fonts/seguiemj.ttf') format('truetype');
    font-display: block;
  }
  .dshf-wrap { font-family: 'TestEmoji', system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
  #panel { width: 360px; height: 640px; }
</style>
</head>
<body>
<div id="panel"></div>
<div id="log"></div>

<!-- React UMD（本地测试用；真实 DSH webview 由宿主提供） -->
<script src="react.js"></script>
<script src="react-dom.js"></script>

<script>
const logEl = document.getElementById('log')
const log = (...a) => { logEl.textContent += a.join(' ') + '\n'; console.log(...a) }

// 捕获渲染期错误，写进 #log 供测试读取（node smoke 测不到组件内部）
window.__errors = []
window.addEventListener('error', (e) => {
  const msg = 'window.onerror: ' + (e.message || e)
  window.__errors.push(msg)
  logEl.textContent += msg + '\n'
})
const origError = console.error
console.error = (...a) => {
  logEl.textContent += 'console.error: ' + a.map((x) => (x && x.stack) || String(x)).join(' ') + '\n'
  origError.apply(console, a)
}

// ---- 假 host API：host 路由换成本地 mock，离线也能渲染 ----
const mockProfile = {
  id: 'demo000000000001',
  nickname: '小鲸测试机',
  signature: '今天我的 AI 又把 rm -rf 写对了，幸好我拦住了。',
  mood: '🐳',
  code: 'K7M2QX',
  friends: [
    { code: 'ABC234', alias: '阿改' },
    { code: 'ZZZ999', alias: '' },
    { code: 'QQQ888', alias: '深夜赶稿人' },
  ],
  task: { active: true, error: false, label: '正在重构插件', startedAt: Date.now() },
}
window.fetch = async (url, opts = {}) => {
  log('fetch', url, opts.method || 'GET')
  if (url.endsWith('/dsh-friends/state')) return { ok: true, json: async () => mockProfile }
  if (url.endsWith('/dsh-friends/profile') && opts.method === 'POST') {
    Object.assign(mockProfile, JSON.parse(opts.body))
    return { ok: true, json: async () => ({ ok: true }) }
  }
  if (url.endsWith('/dsh-friends/friends') && opts.method === 'POST') {
    return { ok: true, json: async () => ({ ok: true, friends: mockProfile.friends }) }
  }
  return { ok: false, status: 404, json: async () => ({}) }
}

// ---- 假 __ModuleLoader__ ----
const modules = {}
window.__ModuleLoader__ = {
  load({ id, factory }) {
    const require = (name) => {
      if (name === 'react') return window.React
      throw new Error('unexpected require: ' + name)
    }
    modules[id] = factory(require)
  },
}

// ---- 假 slots ctx ----
const fakeCtx = {
  effect(fn, label) { log('effect:', label); const d = fn(); if (typeof d === 'function') d() },
  slots: {
    inject(seat, cb) { log('slots.inject', seat); return cb() },
    register(desc, Component) {
      log('slots.register', desc.name + '#' + (desc.id || desc.key))
      if (desc.name === 'main') {
        log('main seat: creating root')
        try {
          const root = ReactDOM.createRoot(document.getElementById('panel'))
          root.render(React.createElement(Component, { ...(desc.inject ? desc.inject() : {}) }))
          window.__panelRoot = root
          log('main seat: render() called')
        } catch (e) {
          log('main seat: render FAILED: ' + ((e && e.stack) || e))
        }
      }
      return () => {}
    },
  },
}
</script>

<script src="client.js"></script>
<script>
  try {
    modules['dsh-friends'].apply(fakeCtx)
    log('apply OK')
  } catch (e) {
    log('apply FAILED: ' + (e && e.stack || e))
  }
</script>
</body>
</html>
