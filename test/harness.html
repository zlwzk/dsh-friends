<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-friends render harness</title>
<style>
  /* 主题由 ?theme=light|dark 选择；默认深色。截图时页面只有面板，调试信息在面板外。 */
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1218; color: #f0f3f8;
  }
  body[data-theme="light"] { background: #eef1f6; color: #131720; }
  /* 侧栏容器：模拟 DSH 左栏的观感 */
  #rail { width: 240px; height: 100%; display: flex; flex-direction: column;
    background: #161a21; border-right: 1px solid #333b4a; }
  body[data-theme="light"] #rail { background: #ffffff; border-right-color: #d8dee8; }
  #panel { flex: 1; min-height: 0; }
  #log { position: fixed; left: 260px; top: 8px; width: 520px; max-height: 90vh; overflow: auto;
    font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap;
    color: #7ec699; opacity: .85; }
  body[data-theme="light"] #log { color: #1a7f4b; }

  /* ego-linux 运行时不带 emoji 字体；挂上 Windows 的 Segoe UI Emoji，
     让截图里的 emoji 与真实 DSH（Windows Chrome/Electron）一致。 */
  @font-face {
    font-family: 'TestEmoji';
    src: url('file:///C:/Windows/Fonts/seguiemj.ttf') format('truetype');
    font-display: block;
  }
  .dshf-wrap { font-family: 'TestEmoji', system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
<div id="rail"><div id="panel"></div></div>
<div id="log"></div>

<!-- React UMD（本地测试用；真实 DSH webview 由宿主提供） -->
<script src="react.js"></script>
<script src="react-dom.js"></script>

<script>
// ?theme=light|dark 选择截图底色；dark 时同时给 body 打 data-ds-dark-theme，
// 模拟 DSH 深色主题的真实路径（宿主就是靠这个属性通知插件的）。
const theme = new URLSearchParams(location.search).get('theme') || 'dark'
if (theme === 'light') {
  document.body.dataset.theme = 'light'
} else {
  document.body.dataset.theme = 'dark'
  document.body.dataset.dsDarkTheme = ''
}

const logEl = document.getElementById('log')
const log = (...a) => { logEl.textContent += a.join(' ') + '\n'; console.log(...a) }

// 捕获渲染期错误，写进 #log 供测试读取（node smoke 测不到组件内部）
window.__errors = []
window.addEventListener('error', (e) => {
  const msg = 'window.onerror: ' + (e.message || e)
  window.__errors.push(msg)
  logEl.textContent += msg + '\n'
})
const origError = console.error
console.error = (...a) => {
  logEl.textContent += 'console.error: ' + a.map((x) => (x && x.stack) || String(x)).join(' ') + '\n'
  origError.apply(console, a)
}

// ---- 假 host API：host 路由换成本地 mock，离线也能渲染 ----
const mockProfile = {
  id: 'demo000000000001',
  nickname: '小鲸测试机',
  signature: '今天我的 AI 又把 rm -rf 写对了，幸好我拦住了。',
  mood: '🐳',
  code: 'K7M2QX',
  acceptMode: 'approve',
  stealth: false,
  friends: [
    { code: 'ABC234', alias: '阿改', addedAt: Date.now() - 86400000 * 3 },
    { code: 'ZZZ999', alias: '', addedAt: Date.now() - 86400000 },
    { code: 'QQQ888', alias: '深夜赶稿人', addedAt: Date.now() - 3600000 * 5 },
    { code: 'M4K8PD', alias: '隔壁工位', addedAt: Date.now() - 60000 },
  ],
  requests: {
    incoming: [
      { code: 'PQ7R3T', fromNickname: '老王', message: '我是老王，加个鲸友', ts: Date.now() - 600000 },
    ],
    outgoing: [
      { code: 'W5X8YZ', message: '在论坛看到你的插件，交个朋友', ts: Date.now() - 1800000 },
    ],
  },
  task: { active: true, error: false, label: '正在重构插件', startedAt: Date.now() },
}
window.fetch = async (url, opts = {}) => {
  log('fetch', url, opts.method || 'GET')
  // 记录所有写入，便于定位"requests 被谁清空"这类问题
  window.__postLog = window.__postLog || []
  if (opts.method === 'POST') {
    let body = null
    try { body = JSON.parse(opts.body) } catch (e) { body = String(opts.body) }
    window.__postLog.push({ url, body })
  }
  if (url.endsWith('/dsh-friends/state')) return { ok: true, json: async () => mockProfile }
  if (url.endsWith('/dsh-friends/installed')) {
    return { ok: true, json: async () => ({ plugins: [
      { name: 'dsh-friends', version: '0.4.0' },
      { name: 'dsh-whale-widget', version: '0.4.2' },
      { name: 'dsh-wsl-tool', version: '1.12.8' },
    ] }) }
  }
  if (url.endsWith('/dsh-friends/profile') && opts.method === 'POST') {
    Object.assign(mockProfile, JSON.parse(opts.body))
    return { ok: true, json: async () => ({ ok: true }) }
  }
  if (url.endsWith('/dsh-friends/friends') && opts.method === 'POST') {
    return { ok: true, json: async () => ({ ok: true, friends: mockProfile.friends }) }
  }
  return { ok: false, status: 404, json: async () => ({}) }
}

// 把在线好友的状态塞进 store 的实时层，让截图有"在线/忙碌/离线"的层次
window.__seedLive = (store) => {
  if (!store || !store.state) return
  const f = store.state.friends
  const seed = (code, patch) => { const x = f.get(code); if (x) Object.assign(x, patch) }
  seed('ABC234', { online: true, status: 'busy', label: '跑一个长任务', nickname: '阿改', signature: '别戳，在 debug。', mood: '🛠', lastSeen: Date.now() })
  seed('QQQ888', { online: true, status: 'online', nickname: '深夜赶稿人', signature: '凌晨三点的 DSH 最好用', mood: '🌙', lastSeen: Date.now() })
  seed('M4K8PD', { online: true, status: 'error', label: '构建挂了', nickname: '隔壁工位', signature: '谁来救救我', mood: '😵', lastSeen: Date.now() })
  seed('ZZZ999', { online: false, nickname: 'ZZZ999', lastSeen: Date.now() - 3600000 * 2 })
}

// 预置一段会话，用于验证聊天视图（?chat=CODE 时直线打开会话）
window.__seedThread = (code) => {
  const key = 'dshf-thread-' + String(code).toUpperCase()
  if (localStorage.getItem(key)) return
  const now = Date.now()
  const list = [
    { msgId: 'a1', direction: 'in', kind: 'chat', text: '你那边的插件跑起来了吗？', ts: now - 600000 },
    { msgId: 'a2', direction: 'out', kind: 'chat', text: '跑了，申请流程也通了', ts: now - 540000 },
    { msgId: 'a3', direction: 'in', kind: 'file', file: { name: '重构方案.md', size: 2048, mime: 'text/markdown' }, data: 'aGVsbG8=', ts: now - 420000, unread: true },
    { msgId: 'a4', direction: 'in', kind: 'chat', text: '顺便把这个插件发你了', ts: now - 300000, unread: true },
    { msgId: 'a5', direction: 'in', kind: 'plugin', plugin: { name: 'dsh-wsl-tool', version: '1.12.8' }, ts: now - 240000, unread: true },
  ]
  localStorage.setItem(key, JSON.stringify(list))
}

// ---- 假 __ModuleLoader__ ----
const modules = {}
window.__ModuleLoader__ = {
  load({ id, factory }) {
    const require = (name) => {
      if (name === 'react') return window.React
      throw new Error('unexpected require: ' + name)
    }
    modules[id] = factory(require)
  },
}

// ---- 假的 WebSocket：让 client 以为自己连上了公共 broker，但不产生真实流量。
// 公共 broker 上可能有其他人用同一个好友码测试，会意外改写面板状态；离线假连接
// 让渲染测试完全确定。真实连通性由 test/relay.test.mjs 单独覆盖。
const REAL_WS = window.WebSocket
function FakeWS(url, protocols) {
  this.url = url
  this.readyState = 0
  this.binaryType = 'blob'
  const self = this
  setTimeout(() => {
    self.readyState = 1
    self.onopen && self.onopen()
    // CONNECT -> CONNACK (rc=0)
    self.onmessage && self.onmessage({ data: new Uint8Array([0x20, 0x02, 0x00, 0x00]).buffer })
  }, 30)
}
FakeWS.prototype.send = function (data) {
  // 只响应 PINGREQ，其余静默丢弃（qos0，无需回执）
  try {
    const u = new Uint8Array(data)
    if ((u[0] >> 4) === 12) {
      this.onmessage && this.onmessage({ data: new Uint8Array([0xd0, 0x00]).buffer })
    }
  } catch (e) { /* ignore */ }
}
FakeWS.prototype.close = function () { this.readyState = 3; this.onclose && this.onclose({ code: 1000 }) }
FakeWS.CONNECTING = 0; FakeWS.OPEN = 1; FakeWS.CLOSING = 2; FakeWS.CLOSED = 3
window.WebSocket = FakeWS

// ---- 假 slots ctx ----
// effect(fn, label)：立即执行 fn 拿到 disposer 并保存，页面卸载时才调用。
// 不能立刻调用 disposer——那会把刚注入的样式又删掉。
const disposers = []
const fakeCtx = {
  effect(fn, label) {
    log('effect:', label)
    try {
      const d = fn()
      if (typeof d === 'function') disposers.push(d)
    } catch (e) {
      log('effect FAILED: ' + ((e && e.stack) || e))
    }
  },
  slots: {
    inject(seat, cb) { log('slots.inject', seat); return cb() },
    register(desc, Component) {
      log('slots.register', desc.name + '#' + (desc.id || desc.key))
      if (desc.name === 'main') {
        log('main seat: creating root')
        try {
          const root = ReactDOM.createRoot(document.getElementById('panel'))
          root.render(React.createElement(Component, { ...(desc.inject ? desc.inject() : {}) }))
          window.__panelRoot = root
          log('main seat: render() called')
        } catch (e) {
          log('main seat: render FAILED: ' + ((e && e.stack) || e))
        }
      }
      return () => {}
    },
  },
}
</script>

<script src="client.js"></script>
<script>
  try {
    modules['dsh-friends'].apply(fakeCtx)
    log('apply OK')
  } catch (e) {
    log('apply FAILED: ' + (e && e.stack || e))
  }
  // 持续把在线好友状态灌进实时层（截图/渲染验证用）。
  // 之所以持续而不是只灌一次：store.init 的异步 reconcile 与面板重挂都可能替换
  // friends Map 里的对象，只灌一次会被后来者覆盖。真实连通性由 relay.test.mjs 覆盖。
  // ?chat=CODE 时预置并打开一段会话，用来验证聊天视图。
  const chatCode = new URLSearchParams(location.search).get('chat')
  let seeded = false
  const seedTimer = setInterval(() => {
    const store = window.__dshfStore
    if (store && store.state && store.state.me && store.state.friends.size >= 4) {
      window.__seedLive(store)
      if (!seeded) {
        seeded = true
        log('seed: live states injected')
        if (chatCode) {
          window.__seedThread(chatCode)
          store.openChat(chatCode)
          log('seed: opened chat with ' + chatCode)
        }
      }
    }
  }, 250)
</script>
</body>
</html>
